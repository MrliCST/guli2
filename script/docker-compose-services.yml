services:
  # 网关服务
  ruoyi-gateway:
    image: ruoyi/ruoyi-gateway:2.6.2
    container_name: guli-gateway
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms512m -Xmx768m"
    ports:
      - "8080:8080"
    volumes:
      - ../data-home/mnt/ruoyi-gateway/logs/:/ruoyi/gateway/logs
      - ../data-home/mnt/skywalking/agent/:/ruoyi/skywalking/agent
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    privileged: true
    networks:
      - gulimail


  # 认证鉴权中心
  ruoyi-auth:
    image: ruoyi/ruoyi-auth:2.6.2
    container_name: guli-auth
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms512m -Xmx768m"
    ports:
      - "9210:9210"
    volumes:
      - ../data-home/mnt/ruoyi-auth/logs/:/ruoyi/auth/logs
      - ../data-home/mnt/skywalking/agent/:/ruoyi/skywalking/agent
    privileged: true
    networks:
      - gulimail

  # 权限管理系统中心
  ruoyi-system:
    image: ruoyi/ruoyi-system:2.6.2
    container_name: guli-system
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms512m -Xmx768m -Ddubbo.protocol.port=20880"
    ports:
      - "9201:9201"
      - "20880:20880"  # 远程调用中心，给windows暴露的端口
    volumes:
      - ../data-home/mnt/ruoyi-system/logs/:/ruoyi/system/logs
      - ../data-home/mnt/skywalking/agent/:/ruoyi/skywalking/agent
    privileged: true
    networks:
      - gulimail

  # 代码生成器
  ruoyi-gen:
    image: ruoyi/ruoyi-gen:2.6.2
    container_name: guli-gen
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms512m -Xmx768m"
    ports:
      - "9202:9202"
    volumes:
      - ../data-home/mnt/ruoyi-gen/logs/:/ruoyi/gen/logs
      - ../data-home/mnt/skywalking/agent/:/ruoyi/skywalking/agent
    privileged: true
    networks:
      - gulimail

  # 定时任务执行机构
  ruoyi-job:
    image: ruoyi/ruoyi-job:2.6.2
    container_name: guli-job
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms512m -Xmx768m"
      SERVER_PORT: 9203
      SNAIL_PORT: 19203  
    ports:
      - "9203:9203"
    volumes:
      - ../data-home/mnt/ruoyi-job/logs/:/ruoyi/job/logs
      - ../data-home/mnt/skywalking/agent/:/ruoyi/skywalking/agent
    privileged: true
    networks:
      - gulimail

  # 资源管理
  ruoyi-resource:
    image: ruoyi/ruoyi-resource:2.6.2
    container_name: guli-resource
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms512m -Xmx768m"
    ports:
      - "9204:9204"
    volumes:
      - ../data-home/mnt/ruoyi-resource/logs/:/ruoyi/resource/logs
      - ../data-home/mnt/skywalking/agent/:/ruoyi/skywalking/agent
    privileged: true
    networks:
      - gulimail

  # 工作流
  ruoyi-workflow:
    image: ruoyi/ruoyi-workflow:2.6.2
    container_name: guli-workflow
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms512m -Xmx768m"
    ports:
      - "9205:9205"
    volumes:
      - ../data-home/mnt/ruoyi-workflow/logs/:/ruoyi/workflow/logs
      - ../data-home/mnt/skywalking/agent/:/ruoyi/skywalking/agent
    privileged: true
    networks:
      - gulimail

  # 监控中心
  ruoyi-monitor:
    image: ruoyi/ruoyi-monitor:2.6.2
    container_name: guli-monitor
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms512m -Xmx768m"
    ports:
      - "9100:9100"
    volumes:
      - ../data-home/mnt/ruoyi-monitor/logs/:/ruoyi/monitor/logs
      - ../data-home/mnt/skywalking/agent/:/ruoyi/skywalking/agent
    privileged: true
    networks:
      - gulimail

networks:
  gulimail:
    external: true
